version: 2

seeds:
  - name: llm_prices_models
    description: >
      One row per provider and model, generated by scripts/build_seeds.py from an
      llm-prices release. Prices are USD per 1M tokens. Do not edit by hand.
  - name: llm_prices_keys
    description: >
      Every id a usage log may carry (model id, alias, provider/model) mapped to a
      provider and model. A key priced by more than one provider has one default
      (is_default = true): the provider named in the key prefix, otherwise the first
      provider alphabetically.
